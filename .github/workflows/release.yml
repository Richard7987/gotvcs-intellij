name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback: mirrored pushes (e.g. Forgejo -> GitHub) don't always
  # emit the `push` event Actions listens for. Run this against the tag you
  # want to release from the "Run workflow" dropdown.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and release
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # softprops/action-gh-release only infers the tag automatically on
          # a real `push` tag event; workflow_dispatch runs need it explicit.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/distributions/*.zip

      - name: Publish to JetBrains Marketplace
        if: ${{ env.PUBLISH_TOKEN != '' }}
        run: ./gradlew publishPlugin
