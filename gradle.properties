# Ruta a la instalación local de IntelliJ Ultimate contra la que se compila
# y desde la que se resuelven las clases de plataforma (VCS API, etc).
# En NixOS esta ruta vive bajo /nix/store y cambia con cada actualización del
# paquete `idea` en /nixdots — si `gradle buildPlugin` falla con un error de
# "local IDE not found", resolver la ruta actual con:
#   readlink -f /etc/profiles/per-user/ale/bin/idea
# y actualizar ideLocalPath más abajo.
ideLocalPath=/nix/store/2j9cidng2j273q9p2xzn0mxj5hkh53fc-idea-2026.1.4/idea

kotlin.stdlib.default.dependency=false
